# Builds the Android app on GitHub's servers and offers the APK as a download.
# Find it under Actions → "Android APK" → the latest run → Artifacts.
name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Show the Android platforms this runner offers
        run: |
          echo "Installed:"; ls "$ANDROID_HOME/platforms" || true
          echo "Available:"; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -oE "platforms;android-[0-9.A-Za-z-]+" | sort -uV | tail -8

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: michys-pet-snake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
