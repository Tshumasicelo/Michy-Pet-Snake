# Publishes the browser version of the game (the web/ folder) to GitHub Pages.
# Runs only when started by hand: Actions → "Publish to GitHub Pages" → Run workflow.
# First enable Pages once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
